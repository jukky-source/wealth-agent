<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#08080a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wealth Agent" />
<meta name="description" content="自律型収益エージェント — 話しかけるだけで、調査・実行・検証・改善を自分で回し続ける" />
<title>Wealth Agent</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
<link rel="mask-icon" href="icons/icon-192.png" color="#08080a" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="nav.css" />
<script>/* 端末の実測: ステータスバー余白と可視高さを測って CSS 変数に入れる（埋め込みブラウザは env() が 0 を返すことがある） */(function(){var d=document.documentElement,ua=navigator.userAgent||"",plat=navigator.platform||"";var ios=/iPad|iPhone|iPod/.test(ua)||/iPad|iPhone|iPod/.test(plat)||(plat==="MacIntel"&&navigator.maxTouchPoints>1);var touch=(navigator.maxTouchPoints||0)>1,narrow=Math.min(screen.width||0,screen.height||0)<=520||innerWidth<=520;var shell=ios||(touch&&narrow);if(!shell)return;d.classList.add("wa-shell");if(ios)d.classList.add("ios");function ins(t){var p=document.createElement("div");p.style.cssText="position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-"+t+",0px);pointer-events:none;opacity:0";document.body.appendChild(p);var h=Math.round(p.getBoundingClientRect().height||0);p.remove();return h}function fit(){var vv=window.visualViewport,h=Math.round((vv&&vv.height)||window.innerHeight||0),sh=Math.round(screen.height||0),st=!!navigator.standalone||!!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);if(st&&sh>h)h=sh;if(h>240)d.style.setProperty("--wa-h",h+"px");var it=ins("top"),ib=ins("bottom");d.style.setProperty("--wa-top",Math.max(it,st?59:0)+"px");window.__waMeasure={insetTop:it,insetBottom:ib,h:h,innerH:window.innerHeight,vvH:(window.visualViewport&&window.visualViewport.height)||0,screenH:screen.height,availH:screen.availHeight,ua:ua.slice(0,120),platform:plat}}if(document.body)fit();else document.addEventListener("DOMContentLoaded",fit);addEventListener("resize",fit);if(window.visualViewport)window.visualViewport.addEventListener("resize",fit);window.waMeasure=function(){var m=window.__waMeasure||{},o=document.getElementById("waMeasureOut");if(o)o.textContent="可視高さ "+m.h+" / innerHeight "+m.innerH+" / screen "+m.screenH+" / 上余白 "+m.insetTop+" / 下余白 "+m.insetBottom+" / "+m.platform;return m}})();</script>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><div class="splash-mark"><i></i><i></i><i></i></div><b>Wealth Agent</b></div>
<div class="app" id="app">

  <aside class="rail" id="rail" aria-hidden="true">
    <div class="rail-top">
      <button class="newchat" id="newChat" type="button"><span class="ic"></span>新しい会話</button>
      <button class="icon-btn rail-x" id="railClose" aria-label="閉じる">✕</button>
    </div>
    <label class="rail-search">
      <span class="ic"></span>
      <input id="threadSearch" type="search" placeholder="会話を検索" enterkeyhint="search" />
    </label>
    <div class="rail-list" id="railList"></div>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <div class="rail-scrim" id="railScrim"></div>

  <div class="main-col">
    <header class="bar">
      <button class="icon-btn rail-btn" id="railBtn" aria-label="会話一覧">☰</button>
      <button class="ava" id="avaBtn" aria-label="エージェントの情報"></button>
      <button class="who" id="whoBtn" aria-label="状態の詳細">
        <span class="nm" id="agentName">Wealth Agent</span>
        <span class="st"><i class="pulse" id="pulse"></i><span id="agentStatus">接続中</span></span>
      </button>
      <a class="lab-link" id="labBtn" href="./lab.html" title="バックテスト作業台（E8モード / 自己資金モード）" style="align-self:center;font-size:12.5px;text-decoration:none">作業台</a>
      <button class="icon-btn" id="moreBtn" aria-label="その他">⋯</button>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>
    <div class="drop-hint" aria-hidden="true">画像をここに放すと添付します</div>
    <div class="chips" id="chips"></div>
    <div class="attach" id="attach"></div>
    <form class="composer" id="composer" autocomplete="off">
      <button class="attach-btn" id="attachBtn" type="button" aria-label="画像を添付">＋</button>
      <input type="file" id="fileIn" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="エージェントに指示する" enterkeyhint="send"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="送信">↑</button>
    </form>
  </div>

  <div class="sheet-scrim" id="sheetScrim"></div>
  <aside class="sheet" id="sheet" aria-hidden="true"><div class="sheet-in" id="sheetIn"></div></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<div class="views" id="views" hidden></div>
<nav class="bnav" id="bnav" aria-label="メインナビゲーション"></nav>
<script type="module" src="app.js"></script>
<script type="module" src="nav.js"></script>
</body>
</html>
