<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#08080a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wealth Agent" />
<meta name="description" content="自律型収益エージェント — 話しかけるだけで、調査・実行・検証・改善を自分で回し続ける" />
<title>Wealth Agent</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
<link rel="mask-icon" href="icons/icon-192.png" color="#08080a" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button class="ava" id="avaBtn" aria-label="エージェントの情報"></button>
    <button class="who" id="whoBtn" aria-label="状態の詳細">
      <span class="nm" id="agentName">Wealth Agent</span>
      <span class="st"><i class="pulse" id="pulse"></i><span id="agentStatus">接続中</span></span>
    </button>
    <button class="icon-btn" id="moreBtn" aria-label="その他">⋯</button>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <div class="chips" id="chips"></div>

  <form class="composer" id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="エージェントに指示する" enterkeyhint="send"></textarea>
    <button class="send" id="sendBtn" type="submit" aria-label="送信">↑</button>
  </form>

  <div class="sheet-scrim" id="sheetScrim"></div>
  <aside class="sheet" id="sheet" aria-hidden="true"><div class="sheet-in" id="sheetIn"></div></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
