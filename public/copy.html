<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>本文をコピー</title>
<style>
:root{--bg:#0b0d12;--fg:#e8ecf4;--mut:#98a2b8;--panel:#141821;--line:#232a38;--acc:#6d8cff}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--fg:#111827;--mut:#5b6478;--panel:#fff;--line:#e3e6ef;--acc:#3b5bfd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding:15px 15px calc(15px + env(safe-area-inset-bottom))}
h1{font-size:17px;margin:0 0 6px}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
textarea{width:100%;height:54vh;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:13px;font-family:inherit;font-size:15px;line-height:1.75;resize:vertical;white-space:pre-wrap}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:inherit;font-size:15px;font-weight:600;text-decoration:none}
.btn.primary{background:var(--acc);border-color:transparent;color:#fff}
.st{color:var(--mut);font-size:13px;margin-top:11px}
</style>
</head>
<body>
<h1 id="t">本文</h1>
<p class="hint">枠を長押し → 全選択 → コピー、で貼り付けできます（アプリの中でコピーが効かないとき用の画面です）。</p>
<textarea id="ta" readonly spellcheck="false"></textarea>
<div class="row">
  <button class="btn primary" id="all" type="button">全選択する</button>
  <button class="btn" id="cp" type="button">コピー</button>
  <a class="btn" id="go" href="#" target="_blank" rel="noreferrer">開く</a>
</div>
<div class="st" id="st"></div>
<script>
var ta = document.getElementById('ta');
var h1 = document.getElementById('t');
var st = document.getElementById('st');
var go = document.getElementById('go');
function pick() {
  try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); } catch (e) {}
}
document.getElementById('all').addEventListener('click', function () { pick(); st.textContent = '全選択しました。下の「コピー」か、長押しのメニューからコピーしてください。'; });
document.getElementById('cp').addEventListener('click', function () {
  pick();
  try { document.execCommand('copy'); st.textContent = 'コピーしました。元の画面に戻って貼り付けてください。'; return; } catch (e) {}
  if (navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(function () { st.textContent = 'コピーしました。元の画面に戻って貼り付けてください。'; }, function () { st.textContent = 'コピーできません。枠を長押し → 全選択 → コピーしてください。'; });
    return;
  }
  st.textContent = 'コピーできません。枠を長押し → 全選択 → コピーしてください。';
});
try {
  var raw = localStorage.getItem('wa_copybox');
  if (!raw) { h1.textContent = '本文がありません'; st.textContent = 'アプリの「SNS投稿」から、もう一度「別のタブで開く」を押してください。'; }
  else {
    var d = JSON.parse(raw) || {};
    h1.textContent = d.title ? String(d.title) : '本文';
    ta.value = String(d.text || '');
    st.textContent = ta.value.length + '文字';
    if (d.url) { go.href = String(d.url); } else { go.style.display = 'none'; }
    pick();
  }
} catch (e) { h1.textContent = '読み込みに失敗しました'; st.textContent = String((e && e.message) || e); }
</script>
</body>
</html>
