# Cloudflare Containers（月$5）で動かすとき用の設定。
#
# 無料枠で動かすときは wrangler.toml のままで構いません（このファイルは使いません）。
# 使い分ける理由：Containers は Workers Paid（$5/月）が前提で、配備に Docker が要ります。
# つまり「ffmpeg を動かすための、唯一の月額」です。
#
# 配備：
#   npm i @cloudflare/containers
#   CLOUDFLARE_API_TOKEN=... CLOUDFLARE_ACCOUNT_ID=... npx wrangler deploy -c wrangler.containers.toml

name = "wealth-agent"
main = "src/container-entry.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/.well-known/*","/api/*","/v1/*","/a2a","/mcp","/llms.txt","/robots.txt","/sitemap.xml","/openapi.json","/server.json"]

[[d1_databases]]
binding = "DB"
database_name = "wealth-agent"
database_id = "ceb1ddc7-0351-4d0f-afbd-ac8989814e74"

[limits]
cpu_ms = 60000

[observability]
enabled = true

# Workers AI（頭脳）。無料は1日 10,000 Neurons。超過は課金されるので
# WORKERS_AI_NEURON_CAP（既定 9,000）でコード側が止める。
[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[vars]
AGENT_NAME = "Wealth Agent"
# 自律リサーチ（スカウト）。無料・鍵不要の巡回先だけを数箇所ずつ回す。原価0。
SCOUT_ENABLED = "true"
SCOUT_EVERY_MINUTES = "180"
SCOUT_SOURCES_PER_TICK = "6"
SCOUT_PER_SOURCE = "12"
SCOUT_MIN_SCORE = "30"
# FX Lab（試行錯誤ループ）。少数の実験を回し続け、王者が更新されたら fx_strategies へ昇格する。
FX_LAB_ENABLED = "true"
INDEXNOW_KEY = "bb1344d428f592a2d266748b143b0fb1"
# 無料枠（フリーミアム）: 決定的で原価ゼロの4品目だけを支払いなしで試せる。
# 上限は IPごと・UTC日ごと。url-meta だけは外向き取得があるので別枠で小さくする。
FREE_TIER_ENABLED = "1"
FREE_DAILY_LIMIT = "25"
FREE_URL_META_DAILY_LIMIT = "5"
PUBLIC_HOST = "wealth-agent.wealthagent-app.workers.dev"
FX_LAB_EVERY_MINUTES = "15"
FX_LAB_EXPERIMENTS_PER_TICK = "4"
FX_LAB_CPU_BUDGET_MS = "20000"
FX_LAB_DEEP_PER_TICK = "1"
FX_LAB_DEEP_BUDGET_MS = "12000"
FX_LAB_LOGIC_ENABLED = "true"
FX_LAB_LOGIC_EVERY_MINUTES = "5"
FX_LAB_LOGIC_PER_TICK = "3"
FX_LAB_LOGIC_BUDGET_MS = "9000"
FX_LAB_LOGIC_DEEP_PER_TICK = "1"
# SNS下書きの自動補充（X / note / YouTube）。投稿はしない（承認制のまま）。
SOCIAL_ENABLED = "true"
SOCIAL_EVERY_MINUTES = "720"
SOCIAL_DRAFTS_PER_TICK = "2"
ENGINE_STEPS_PER_TICK = "3"
AI_DAILY_CALL_BUDGET = "1200"
X402_TESTNET_ENABLED = "0"
# 受け取り先（ネットワークごとに必要）。Solana は base58、EVM は 0x…。Solana の値札には
# facilitator が提示する feePayer（ガス肩代わり）を添えるので、/supported で確認して使う。
X402_FEE_PAYER = "CjNFTjvBhbJJd2B5ePPMHRLx1ELZpa8dwQgGL727eKww"
X402_SOLANA_PAY_TO = "GgvECKqPR1LHdv9vvpi3bfqs2v9jEJsqdwbNT7DzouD"
AI_CALLS_PER_TICK = "1"
AI_HOURLY_NEURON_CAP = "380"
AI_CACHE_TTL_MS = "21600000"
ALLOW_PAID_AI = "false"
WORKERS_AI_NEURON_CAP = "9000"
RUNNER_ENABLED = "true"
RUNNER_MODE = "container"
RUNNER_INSTANCE_TYPE = "basic"

# --- 実行環境（手足）---------------------------------------------------------
# basic = 1/4 vCPU / 1 GiB / 4 GB ディスク。
# 無料で付く範囲：mem 25 GiB時間・vCPU 375分・disk 200 GB時間（毎月）。
# 5分の1080p動画を1本作るのに、おおよそ mem 600 GiB秒・vCPU 150秒 → 月100本以上が枠内。
# 課金は「動いている間だけ」で、sleepAfter の5分で自動的に止まります。
#   → $5は最低額で、枠を超えた分は従量課金です（mem $0.0000025/GiB秒・CPU $0.000020/vCPU秒・disk $0.00000007/GB秒）。
#   → max_instances = 1：このアプリは常に同じ1インスタンスしか使わないため、2にしても使われないまま最悪時の上限だけが倍になります。
[[containers]]
max_instances = 1
class_name = "RunnerContainer"
image = "registry.cloudflare.com/aab5dd9cbdd50399b1c3eada686b424b/wa-runner:1"
instance_type = "basic"

[[durable_objects.bindings]]
name = "RUNNER_CONTAINER"
class_name = "RunnerContainer"

[exports.RunnerContainer]
type = "durable-object"
storage = "sqlite"

# 秘密は wrangler secret put で：
#   RUNNER_TOKEN / OWNER_TOKEN / （無料AIのキー各種）
