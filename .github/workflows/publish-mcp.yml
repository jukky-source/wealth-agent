name: publish-mcp-registry

# 公式 MCP レジストリ（registry.modelcontextprotocol.io）へ server.json を公開する。
#
# 名前空間 `io.github.jukky-source/*` は **GitHub OIDC** で自動認証される。
# レジストリの仕様：「そのユーザーのリポジトリ上の GitHub Action から実行されていればよい」。
# つまり独自ドメインも DNS TXT も、人間のブラウザ操作も要らない（id-token: write だけ）。
#
# 手動実行も、server.json を書き換えた push でも走る。

on:
  workflow_dispatch:
  push:
    paths:
      - "server.json"
      - ".github/workflows/publish-mcp.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: mcp-publisher を取得
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp
          BIN="$(find /tmp -maxdepth 2 -type f -name 'mcp-publisher' | head -n 1)"
          test -n "$BIN"
          sudo install -m 0755 "$BIN" /usr/local/bin/mcp-publisher
          mcp-publisher --help || true

      - name: OIDC でログイン
        run: mcp-publisher login github-oidc

      - name: 公開
        run: mcp-publisher publish

      - name: 公開されたことを確認
        run: |
          set -euo pipefail
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.jukky-source" \
            | jq -e '.servers | length > 0' >/dev/null
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.jukky-source" | jq .
