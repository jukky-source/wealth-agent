name: deploy-cloudflare-containers

# 実行環境（手足）を Cloudflare Containers で立てるための配備。
# 手動実行だけにしています —— main への push で勝手に走ると、
# Containers（Workers Paid / 月$5）が意図せず有効になってしまうためです。

on:
  workflow_dispatch:
    inputs:
      instance_type:
        description: "コンテナの大きさ（lite / basic / standard-1）"
        required: false
        default: "basic"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存を入れる
        run: npm install --no-audit --no-fund

      - name: Containers のクライアントを入れる
        run: npm install @cloudflare/containers --no-audit --no-fund

      - name: テスト
        run: npm test

      - name: 実行ジョブの実機テスト（ffmpeg と espeak-ng が要ります）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          node tests/jobs.test.mjs

      - name: D1 にスキーマを適用
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute wealth-agent --remote --file=./schema.sql -c wrangler.containers.toml || true

      - name: コンテナをビルドして配備（Docker は Actions ランナーに既にあります）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy -c wrangler.containers.toml \
            --var RUNNER_INSTANCE_TYPE:${{ github.event.inputs.instance_type }}

      - name: 秘密を反映
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "${{ secrets.OWNER_TOKEN }}" ] && printf '%s' "${{ secrets.OWNER_TOKEN }}" | npx wrangler secret put OWNER_TOKEN -c wrangler.containers.toml || true
          [ -n "${{ secrets.RUNNER_TOKEN }}" ] && printf '%s' "${{ secrets.RUNNER_TOKEN }}" | npx wrangler secret put RUNNER_TOKEN -c wrangler.containers.toml || true
