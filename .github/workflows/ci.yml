name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for f in src/*.js src/*/*.js server/*.mjs public/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node tests/unit.test.mjs
      - name: Acceptance tests
        run: node tests/run.mjs
      - name: Avatar tests
        run: node tests/avatar.test.mjs
      - name: Fleet and image-settings tests
        run: node tests/fleet.test.mjs
