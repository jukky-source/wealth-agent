# Cloudflare Workers configuration — Wealth Agent backend
# Free plan: 100k requests/day, D1 5M rows read & 100k rows written/day, 5 cron triggers/account.
# NOTE: Free plan gives 10ms CPU per invocation. All heavy loop work is therefore
# step-chunked: each tick performs a bounded number of steps and returns.

name = "wealth-agent"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static PWA assets are served by the Worker from ./public
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "wealth-agent"
database_id = "ceb1ddc7-0351-4d0f-afbd-ac8989814e74"

[observability]
enabled = true

# Workers AI（頭脳）。無料は1日 10,000 Neurons。超過は課金されるので
# WORKERS_AI_NEURON_CAP（既定 9,000）でコード側が止める。
[ai]
binding = "AI"

# --- Scheduler ---------------------------------------------------------------
# Cron Triggers are the heartbeat of the autonomous loop. Free plan allows
# 15 minutes wall-time per invocation (network wait is free), 10ms CPU.
[triggers]
crons = ["*/5 * * * *"]

[vars]

# FX Lab（試行錯誤ループ）— 少数の実験を回し続け、王者が更新されたら昇格する。
FX_LAB_ENABLED = "true"
INDEXNOW_KEY = "bb1344d428f592a2d266748b143b0fb1"
# 無料枠（フリーミアム）: 決定的で原価ゼロの4品目だけを支払いなしで試せる。
# 上限は IPごと・UTC日ごと。url-meta だけは外向き取得があるので別枠で小さくする。
FREE_TIER_ENABLED = "1"
FREE_DAILY_LIMIT = "25"
FREE_URL_META_DAILY_LIMIT = "5"
PUBLIC_HOST = "wealth-agent.wealthagent-app.workers.dev"
FX_LAB_EVERY_MINUTES = "15"
FX_LAB_LOGIC_ENABLED = "true"
FX_LAB_LOGIC_EVERY_MINUTES = "5"
FX_LAB_LOGIC_PER_TICK = "3"
FX_LAB_LOGIC_BUDGET_MS = "9000"
FX_LAB_LOGIC_DEEP_PER_TICK = "1"
FX_LAB_EXPERIMENTS_PER_TICK = "4"
FX_LAB_CPU_BUDGET_MS = "20000"
FX_LAB_DEEP_PER_TICK = "1"
FX_LAB_DEEP_BUDGET_MS = "12000"
# SNS下書きの自動補充（X / note / YouTube）。投稿はしない（承認制のまま）。
SOCIAL_ENABLED = "true"
SOCIAL_EVERY_MINUTES = "720"
SOCIAL_DRAFTS_PER_TICK = "2"

# Non-secret configuration. Secrets (OWNER_TOKEN, API keys) go through:
#   wrangler secret put OWNER_TOKEN
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put OPENROUTER_API_KEY
AGENT_NAME = "Wealth Agent"
ENGINE_STEPS_PER_TICK = "3"
AI_DAILY_CALL_BUDGET = "300"
ALLOW_PAID_AI = "false"
WORKERS_AI_NEURON_CAP = "9000"
RUNNER_ENABLED = "true"
